version: 2
updates:
  # GitHub Actions used by .github/workflows, including the floating-tag
  # cmu-sei/Crucible-Github-Actions refs (bumped only if a dotted tag appears).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  # Base images in the root Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5

  # The API's NuGet dependencies (Gameboard.Api.sln is in src/; Dependabot doesn't search subdirectories).
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
    # Wait before taking new releases: hijacked versions are usually caught and pulled within days.
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # MockQueryable.FakeItEasy 10.0.13+ needs FakeItEasy 9, so the two move together.
      fakeiteasy:
        patterns: ["FakeItEasy", "MockQueryable.FakeItEasy"]
      # SharpCompress is still 0.x, where minor versions change the API; it gets its own PR.
      sharpcompress:
        patterns: ["SharpCompress"]
      minor-and-patch:
        # A group without patterns outranks every other group's wildcard.
        patterns: ["*"]
        exclude-patterns: ["FakeItEasy", "MockQueryable.FakeItEasy", "SharpCompress"]
        update-types: [minor, patch]
    # These later versions need a commercial license.
    ignore:
      - dependency-name: AutoMapper
        versions: [">= 15.0.0"]
      - dependency-name: MediatR
        versions: [">= 13.0.0"]


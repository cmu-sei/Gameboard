# Builds the API and runs its unit and integration test projects with the shared Crucible workflow,
# one job each; see the .NET Build and Test section of https://github.com/cmu-sei/Crucible-Github-Actions.
name: Build and Test

# Pull requests validate proposed changes. Pushes to main verify the result after merge.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build-and-test:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/dotnet-test.yaml@dotnet-test-v1
    permissions:
      contents: read
    with:
      test-project: src/Gameboard.Api.Tests.Unit
      build-project: src/Gameboard.Api.Tests.Unit  # the solution is in src/, not the repository root
      expect-postgres: false   # unit tests; no database
      dotnet-version: "10.0.x" # repo has no global.json

  integration-tests:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/dotnet-test.yaml@dotnet-test-v1
    permissions:
      contents: read
    with:
      test-project: src/Gameboard.Api.Tests.Integration
      build-project: src/Gameboard.Api.Tests.Integration  # the solution is in src/, not the repository root
      expect-postgres: false   # Testcontainers PostgreSQL, but not the shared harness's banner
      dotnet-version: "10.0.x" # repo has no global.json
